plugins {
    alias(libs.plugins.androidApplication)
}

android {
    signingConfigs {
        release {
            def keystoreFile = file("signing_cert.p12")
            if (keystoreFile.exists() && System.getenv("KEYSTORE_PASSWORD") != null) {
                storeFile keystoreFile
                storeType "PKCS12"
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    namespace 'in.sunilpaulmathew.weatherwidget'
    compileSdk 37

    defaultConfig {
        applicationId "in.sunilpaulmathew.weatherwidget"
        minSdk 24
        targetSdk 37
        versionCode 8
        versionName "v0.8"
        testFunctionalTest = false
        testHandleProfiling = false
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (file("signing_cert.p12").exists() && System.getenv("KEYSTORE_PASSWORD") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    implementation libs.material
    implementation libs.preference
}